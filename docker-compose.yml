version: '3.8'

services:
  # Container do Banco de Dados
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Container da sua Aplicação Go
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: $PORT
      DB_HOST: $DB_HOST            # Repare aqui: o Host é o NOME do serviço do banco acima!
      DB_PORT: $DB_PORT
      DB_USER: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      DB_NAME: $DB_NAME          # Repare aqui: o Host é o NOME do serviço do banco acima!
    depends_on:
      - db                   # Garante que o banco suba antes do seu app

volumes:
  pgdata: