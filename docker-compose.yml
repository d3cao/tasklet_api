services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-tasklet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tasklet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-tasklet}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      DB_NAME: ${DB_NAME:-tasklet}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
