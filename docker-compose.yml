version: '3.8'

services:
  # Container do Banco de Dados
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: meudb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Container da sua Aplicação Go
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db            # Repare aqui: o Host é o NOME do serviço do banco acima!
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secretpassword
      DB_NAME: meudb
    depends_on:
      - db                   # Garante que o banco suba antes do seu app

volumes:
  pgdata: